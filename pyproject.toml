[project]
name = "sqlalchemy-extended-statistics-extension"
version = "0.1.0"
description = "Alembic & SQLAlchemy plugin for PostgreSQL extended statistics and column statistics targets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Evgenii Bordunov", email = "feugenix@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]
keywords = ["sqlalchemy", "alembic", "postgresql", "extended statistics", "statistics target"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/feugenix/sqlalchemy-extended-statistics-extension"
Issues = "https://github.com/feugenix/sqlalchemy-extended-statistics-extension/issues"
Documentation = "https://github.com/feugenix/sqlalchemy-extended-statistics-extension#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_extended_statistics_extension"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/sqlalchemy_extended_statistics_extension",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.0.0",
]
