[project]
name = "sqlalchemy-extended-statistics-extension"
version = "0.1.0"
description = "Alembic & SQLAlchemy plugin for PostgreSQL extended statistics and column statistics targets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Evgenii Bordunov", email = "feugenix@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_extended_statistics_extension"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/sqlalchemy_extended_statistics_extension",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.0.0",
]
